
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập nhúng CSS vào HTML</title>

    <style>
        .internal-style {
            color: blue;
        }
    </style>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 style="color: red;">Phần 1: Inline CSS</h1>
    <p style="color: red;">Đây là đoạn văn sử dụng inline-style để đổi màu chữ thành đỏ.</p>

    <h1 class="internal-style">Phần 2: Internal CSS</h1>
    <p class="internal-style">Đây là đoạn văn sử dụng internal-style để đổi màu chữ thành xanh dương.</p>

    <h1 class="external-style">Phần 3: External CSS</h1>
    <p class="external-style">Đây là đoạn văn sử dụng external-style để đổi màu chữ thành xanh lá.</p>
</body>
</html>
