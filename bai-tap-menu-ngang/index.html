
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu ngang Dropdown</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;
            background-color: #f2f2f2;
        }

        h1 {
            color: #333;
        }

        #menu {
            height: 40px;
            background-color: #222;
            border: 1px solid #555;
        }

        #menu ul {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        #menu > ul > li {
            float: left;
            position: relative;
        }

        #menu a {
            display: block;
            width: 120px;
            height: 40px;
            line-height: 40px;
            text-align: center;
            text-decoration: none;
            color: white;
        }

        #menu a:hover {
            background-color: red;
        }

        #menu ul ul {
            position: absolute;
            top: 40px;
            left: 0;
            background-color: #222;
            visibility: hidden;
            z-index: 10;
        }

        #menu ul li:hover > ul {
            visibility: visible;
        }
    </style>
</head>
<body>

    <h1>Menu ngang Dropdown</h1>

    <div id="menu">
        <ul>
            <li><a href="#">Trang chủ</a></li>

            <li>
                <a href="#">Sản phẩm</a>
                <ul>
                    <li><a href="#">Laptop</a></li>
                    <li><a href="#">Điện thoại</a></li>
                    <li><a href="#">Máy tính bảng</a></li>
                </ul>
            </li>

            <li>
                <a href="#">Dịch vụ</a>
                <ul>
                    <li><a href="#">Sửa chữa</a></li>
                    <li><a href="#">Bảo hành</a></li>
                    <li><a href="#">Tư vấn</a></li>
                </ul>
            </li>

            <li><a href="#">Giới thiệu</a></li>
            <li><a href="#">Liên hệ</a></li>
        </ul>
    </div>

</body>
</html>
