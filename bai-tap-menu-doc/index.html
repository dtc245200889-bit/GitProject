
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu dọc Dropdown</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 30px;
        }

        h1 {
            color: #333;
        }

        #menu, #menu ul {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        #menu {
            width: 140px;
        }

        #menu li {
            position: relative;
            width: 100px;
            height: 30px;
            padding: 0 20px;
            background-color: black;
            line-height: 30px;
            cursor: pointer;
        }

        #menu li a {
            text-decoration: none;
            color: white;
            display: block;
        }

        #menu li:hover {
            background-color: #04AA6D;
        }

        #menu li ul {
            position: absolute;
            top: 0;
            left: 140px;
            visibility: hidden;
        }

        #menu li:hover > ul {
            visibility: visible;
        }
    </style>
</head>
<body>

    <h1>Menu dọc Dropdown</h1>

    <div id="menu">
        <ul>
            <li><a href="#">Trang chủ</a></li>

            <li>
                <a href="#">Sản phẩm</a>
                <ul>
                    <li><a href="#">Laptop</a></li>
                    <li><a href="#">Điện thoại</a></li>
                    <li><a href="#">Máy tính bảng</a></li>
                </ul>
            </li>

            <li>
                <a href="#">Dịch vụ</a>
                <ul>
                    <li><a href="#">Sửa chữa</a></li>
                    <li><a href="#">Bảo hành</a></li>
                    <li><a href="#">Tư vấn</a></li>
                </ul>
            </li>

            <li><a href="#">Giới thiệu</a></li>
            <li><a href="#">Liên hệ</a></li>
        </ul>
    </div>

</body>
</html>
